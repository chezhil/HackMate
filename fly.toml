# Fly.io: fly launch --copy-config --no-deploy, then see DEPLOY.md.
# One machine only: the data is SQLite on one volume.
app = "hackmate"
primary_region = "bom"

[build]
  dockerfile = "Dockerfile"

[env]
  HACKMATE_REQUIRE_LOGIN = "1"
  PORT = "3000"

[[mounts]]
  source = "hackmate_data"
  destination = "/app/data"

[http_service]
  internal_port = 3000
  force_https = true
  # Reminders and feed refreshes run inside the server, so keep it running.
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    grace_period = "20s"
    interval = "30s"
    timeout = "5s"
    method = "GET"
    path = "/api/health"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
